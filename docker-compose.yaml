x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    env_file:
      - env/db.env
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    <<: *app
    env_file:
      - env/backend.env
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn --bind 0.0.0.0:8000 --workers 4 --threads 4 --timeout 30 config.wsgi:application"
    ports:
      - "8000:8000"

  # Celery worker with embedded beat (-B) to run the CELERY_BEAT_SCHEDULE cronjobs
  worker:
    <<: *app
    env_file:
      - env/worker.env
    command: celery -A config worker -B --loglevel=info
    depends_on:
      backend:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  db_data:
  redis_data:
